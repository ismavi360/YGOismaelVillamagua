<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Card Meta Deck Analysis</title>
    <!-- Google Fonts & Lucide Icons via CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css">

    <style>
        :root {
            /* Sborg Color Palette Implementation */
            --bg-gradient: linear-gradient(135deg, #1a1e29 0%, #132d46 100%);
            --glass-bg: rgba(19, 45, 70, 0.75);
            --glass-border: rgba(1, 195, 142, 0.15);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent: #01c38e; /* Vibrant Sborg Green */
            --accent-hover: #02a377;
            
            /* Professional & Clean Status Colors synced to palette (No more raw oranges/reds) */
            --color-mala: #1a1e29;           
            --color-ineficiente: transparent;
            --color-buena: #1e3a8a;          
            --color-counter: #01c38e;        
            
            --sync-local: #9ca3af;
            --sync-cloud: #01c38e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html, body {
            min-height: 100vh;
            background: #1a1e29; /* Fallback */
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            color: var(--text-main);
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Main Page Wrapper to prevent vertical cropping and background white bands */
        .page-wrapper {
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Glassmorphism Containers */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }

        /* Top Bar Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Optimization: Breathing glow assigned perfectly to text silhouettes using filter drop-shadow */
        .brand-section h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
            position: relative;
            padding: 4px 0;
            animation: breathing-text-glow 4s ease-in-out infinite;
        }

        @keyframes breathing-text-glow {
            0% {
                filter: drop-shadow(0 0 2px rgba(1, 195, 142, 0.15));
            }
            50% {
                filter: drop-shadow(0 0 12px rgba(1, 195, 142, 0.75)) drop-shadow(0 0 25px rgba(1, 195, 142, 0.3));
            }
            100% {
                filter: drop-shadow(0 0 2px rgba(1, 195, 142, 0.15));
            }
        }

        .actions-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Sync Status Badge */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.local { background-color: var(--sync-local); }
        .status-dot.synced { background-color: var(--sync-cloud); }

        /* Buttons styling */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            color: white;
        }
        .btn-primary { background: var(--accent); border: 1px solid rgba(255, 255, 255, 0.1); color: #1a1e29; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: #f3f4f6; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent); }
        .btn-icon { padding: 0.6rem; border-radius: 6px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: var(--text-main); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent); }

        /* Dashboard Workspace */
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .deck-meta-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .deck-title-wrapper {
            flex: 1;
            min-width: 250px;
        }

        .deck-title-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
            width: 100%;
            padding: 4px 0;
            transition: border-color 0.2s;
        }
        .deck-title-input:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }

        .management-inputs {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            overflow: hidden;
            padding: 2px;
        }
        .input-group input {
            background: transparent;
            border: none;
            padding: 0.6rem 1rem;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            width: 180px;
        }

        /* Grid Data Table Design with Fixed Columns Lock */
        .table-container {
            max-width: 100%;
            overflow-x: auto;
            padding: 1px;
            border-radius: 12px;
            background: #132d46;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            table-layout: fixed; 
        }

        th, td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        th:last-child, td:last-child { border-right: none; }

        th {
            background: #1a1e29;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #d1d5db;
        }

        /* --- LOCK DE ESTRUCTURA COMPLETAMENTE ESTÁTICA PARA COLUMNAS 1 Y 2 --- */
        th:nth-child(1), td:nth-child(1) {
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: #1a1e29 !important;
            width: 180px !important;
            min-width: 180px !important;
            max-width: 180px !important;
            box-shadow: 4px 0 8px rgba(0, 0, 0, 0.5);
        }
        
        th:nth-child(2), td:nth-child(2) {
            position: sticky;
            left: 180px; 
            z-index: 10;
            background-color: #1a1e29 !important;
            width: 80px !important;
            min-width: 80px !important;
            max-width: 80px !important;
            border-right: 2px solid var(--glass-border);
            box-shadow: 4px 0 8px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        
        th:nth-child(1), th:nth-child(2) {
            z-index: 12;
            background-color: #132d46 !important;
        }

        /* Columnas de cartas por defecto */
        th:not(:nth-child(1)):not(:nth-child(2)), 
        td:not(:nth-child(1)):not(:nth-child(2)) {
            width: 140px !important;
            min-width: 140px !important;
            max-width: 140px !important;
        }

        tr:hover td {
            background: rgba(1, 195, 142, 0.04);
        }
        tr:hover td:nth-child(1), tr:hover td:nth-child(2) {
            background: #1a2433 !important;
        }

        /* Matrix Elements controls */
        .cell-header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .cell-header-content span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-delete-node {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }
        .btn-delete-node:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* Rating Multi-State Click Selector Control Node Style */
        .rating-interactive-cell {
            padding: 0;
        }

        .rating-trigger-btn {
            width: 100%;
            height: 100%;
            min-height: 48px;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
        }

        /* Dynamic Cell State Color Fill Definitions linked perfectly to Palette */
        .rating-trigger-btn[data-rating="MALA"] {
            background-color: var(--color-mala) !important;
            color: var(--text-muted);
            border: 1px dashed rgba(239, 68, 68, 0.3);
        }
        .rating-trigger-btn[data-rating="INEFICIENTE"] {
            background-color: var(--color-ineficiente) !important;
            color: var(--text-muted);
        }
        .rating-trigger-btn[data-rating="BUENA"] {
            background-color: var(--color-buena) !important;
            color: #ffffff;
        }
        .rating-trigger-btn[data-rating="COUNTER"] {
            background-color: var(--color-counter) !important;
            color: #1a1e29;
        }

        /* Meta Checkbox standard style alignment */
        .meta-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Valuation Row Design styling */
        .valuation-row {
            background: #1a1e29 !important;
        }
        .valuation-row td {
            font-weight: 700;
            color: var(--accent);
            border-bottom: none;
        }
        .valuation-row td:nth-child(1), .valuation-row td:nth-child(2) {
            background-color: #132d46 !important;
        }
        .valuation-score {
            font-size: 1rem;
            text-align: center;
        }

        /* Modal window infrastructure layout */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none; 
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }
        .modal-overlay.active { 
            display: flex; 
            opacity: 1; 
        }
        .modal-content {
            width: 90%;
            max-width: 500px;
            padding: 1.5rem;
            transform: scale(0.98);
            transition: transform 0.2s ease;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            background: #132d46;
            border: 1px solid var(--glass-border);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .modal-title { font-size: 1.1rem; font-weight: 700; color: #ffffff; }
        .modal-body {
            overflow-y: auto;
            margin-bottom: 1.2rem;
            flex: 1;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* Form Controls configuration view mapping */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        .profile-group h4 { margin-bottom: 0.8rem; color: #9ca3af; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;}
        .form-control {
            margin-bottom: 0.6rem;
        }
        .form-control label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 500;}
        .form-control input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
        }
        .form-control input:focus { border-color: var(--accent); }

        /* Remote documents loader list design node layout */
        .search-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 0.6rem 1rem;
            width: 100%;
            color: var(--text-main);
            outline: none;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .search-box:focus { border-color: var(--accent); }
        .deck-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .deck-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .deck-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--accent);
        }
        .deck-item-info .name { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px;}
        .deck-item-info .date { font-size: 0.75rem; color: var(--text-muted); }

        /* Responsive Breakpoints Handling */
        @media (max-width: 768px) {
            .page-wrapper { padding: 1rem; gap: 1rem; }
            header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .brand-section h1 { font-size: 1.6rem; }
            .actions-group { width: 100%; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
            .deck-meta-section { flex-direction: column; align-items: flex-start; }
            .management-inputs { width: 100%; }
            .input-group { width: 100%; }
            .input-group input { flex: 1; }
            .form-grid { grid-template-columns: 1fr; }
            th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2) { position: sticky; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Header / Top Bar Area -->
        <header class="glass-panel">
            <div class="brand-section">
                <i class="lucide-sparkles" style="color: var(--accent); font-size: 1.6rem;"></i>
                <h1>CARD META DECK ANALYSIS</h1>
            </div>
            <div class="actions-group">
                <button class="btn btn-secondary" id="btn-new-deck"><i class="lucide-trash-2"></i>VACIAR DATOS</button>
                <button class="btn btn-secondary" id="btn-open-deck"><i class="lucide-folder-open"></i>ABRIR DECK</button>
                <button class="btn btn-primary" id="btn-save-cloud"><i class="lucide-cloud-upload"></i>GUARDAR DATOS</button>
                <button class="btn-icon" id="btn-config" title="Configuración" style="font-size: 1.1rem; line-height: 1;">⚙️</button>
                <div class="status-badge">
                    <span class="status-dot local" id="sync-indicator"></span>
                    <span id="sync-text">Cambios locales</span>
                </div>
            </div>
        </header>

        <!-- Core Workspace -->
        <main class="main-container">
            <!-- Metadata Actions and inputs management row -->
            <section class="glass-panel deck-meta-section">
                <div class="deck-title-wrapper">
                    <input type="text" class="deck-title-input" id="input-deck-name" placeholder="Nombre del Análisis" value="Mi Nuevo Analysis Deck">
                </div>
                <div class="management-inputs">
                    <div class="input-group">
                        <input type="text" id="input-enemy-name" placeholder="Ingrese deck...">
                    </div>
                    <div class="input-group">
                        <input type="text" id="input-card-name" placeholder="Ingrese carta...">
                    </div>
                    <button class="btn btn-secondary" id="btn-sort-cards" style="padding: 0.6rem 1rem;"><i class="lucide-arrow-down-narrow-wide"></i>Best to Worse</button>
                </div>
            </section>

            <!-- Main Matrix Table Evaluation Interface -->
            <section class="glass-panel table-container">
                <table id="matrix-table">
                    <thead>
                        <tr id="table-header-row">
                            <!-- Populated dynamically via state scripts -->
                        </tr>
                    </thead>
                    <tbody id="table-body-elements">
                        <!-- Populated dynamically via state scripts -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Modal Layout Architecture Framework Structure -->
    <div class="modal-overlay" id="modal-config">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Configuración de Perfiles</h3>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <!-- Normal Profile Inputs -->
                    <div class="profile-group">
                        <h4>Perfil NORMAL</h4>
                        <div class="form-control">
                            <label>MALA</label>
                            <input type="number" id="cfg-n-mala">
                        </div>
                        <div class="form-control">
                            <label>INEFICIENTE</label>
                            <input type="number" id="cfg-n-ineficiente">
                        </div>
                        <div class="form-control">
                            <label>BUENA</label>
                            <input type="number" id="cfg-n-buena">
                        </div>
                        <div class="form-control">
                            <label>COUNTER</label>
                            <input type="number" id="cfg-n-counter">
                        </div>
                    </div>
                    <!-- Meta Profile Inputs -->
                    <div class="profile-group">
                        <h4>Perfil META</h4>
                        <div class="form-control">
                            <label>MALA</label>
                            <input type="number" id="cfg-m-mala">
                        </div>
                        <div class="form-control">
                            <label>INEFICIENTE</label>
                            <input type="number" id="cfg-m-ineficiente">
                        </div>
                        <div class="form-control">
                            <label>BUENA</label>
                            <input type="number" id="cfg-m-buena">
                        </div>
                        <div class="form-control">
                            <label>COUNTER</label>
                            <input type="number" id="cfg-m-counter">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('modal-config')">Cancelar</button>
                <button class="btn btn-primary" id="btn-save-config">Guardar Configuración</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-open">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Abrir deck en base de datos</h3>
            </div>
            <input type="text" class="search-box" id="search-deck-input" placeholder="Buscar deck por nombre...">
            <div class="modal-body">
                <div class="deck-list" id="cloud-decks-container">
                    <!-- Populated programmatically from Firestore collection query -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('modal-open')">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Firebase Connection Engine Module Core Script Execution Initialization Section -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, getDocs, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC58tN_1MeVoc32t1C3liGrQIFqpjryqW8",
            authDomain: "ygoismaelvillamagua.firebaseapp.com",
            projectId: "ygoismaelvillamagua",
            storageBucket: "ygoismaelvillamagua.firebasestorage.app",
            messagingSenderId: "624990862859",
            appId: "1:624990862859:web:170630e1e94d29fb3d910e",
            measurementId: "G-TXKEZS7MRT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let state = {
            id: null,
            deckName: "Mi Nuevo Analysis Deck",
            cards: [],
            enemyDecks: [], 
            ratings: {},    
            weightsNormal: { MALA: -1, INEFICIENTE: 0, BUENA: 1, COUNTER: 3 },
            weightsMeta: { MALA: -2, INEFICIENTE: -1, BUENA: 2, COUNTER: 4 },
            createdAt: null,
            updatedAt: null,
            isSynced: false 
        };

        let remoteDecksCache = [];

        function saveToLocalStorage() {
            localStorage.setItem("CMDA_DECK_DATA", JSON.stringify({
                id: state.id,
                deckName: state.deckName,
                cards: state.cards,
                enemyDecks: state.enemyDecks,
                ratings: state.ratings,
                weightsNormal: state.weightsNormal,
                weightsMeta: state.weightsMeta,
                createdAt: state.createdAt,
                updatedAt: state.updatedAt,
                isSynced: state.isSynced
            }));
            updateSyncIndicator();
        }

        function loadFromLocalStorage() {
            const data = localStorage.getItem("CMDA_DECK_DATA");
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    state.id = parsed.id || null;
                    state.deckName = parsed.deckName || "Mi Nuevo Analysis Deck";
                    state.cards = parsed.cards || [];
                    state.enemyDecks = parsed.enemyDecks || [];
                    state.ratings = parsed.ratings || {};
                    state.weightsNormal = parsed.weightsNormal || { MALA: -1, INEFICIENTE: 0, BUENA: 1, COUNTER: 3 };
                    state.weightsMeta = parsed.weightsMeta || { MALA: -2, INEFICIENTE: -1, BUENA: 2, COUNTER: 4 };
                    state.createdAt = parsed.createdAt || null;
                    state.updatedAt = parsed.updatedAt || null;
                    state.isSynced = parsed.isSynced || false;
                } catch(e) {
                    console.error("Error parsing LocalStorage payload structure data.", e);
                }
            }
            renderInterfaceAll();
        }

        function updateSyncIndicator() {
            const dot = document.getElementById("sync-indicator");
            const label = document.getElementById("sync-text");
            if (state.isSynced) {
                dot.className = "status-dot synced";
                label.innerText = "Sincronizado";
            } else {
                dot.className = "status-dot local";
                label.innerText = "Cambios locales";
            }
        }

        function invokeConfirmation(promptMessage, operationalCallback) {
            if (confirm(promptMessage)) {
                operationalCallback();
            }
        }

        function renderInterfaceAll() {
            document.getElementById("input-deck-name").value = state.deckName;
            buildEvaluationMatrixStructure();
            updateSyncIndicator();
        }

        function computeCardSumaTotal(cardName) {
            let columnAccumulator = 0;
            state.enemyDecks.forEach(enemy => {
                const compositeKey = `${enemy.name}::${cardName}`;
                const elementRating = state.ratings[compositeKey] || "INEFICIENTE";
                const standardWeightsMap = enemy.isMeta ? state.weightsMeta : state.weightsNormal;
                columnAccumulator += Number(standardWeightsMap[elementRating] ?? 0);
            });
            return columnAccumulator;
        }

        function buildEvaluationMatrixStructure() {
            const headerRow = document.getElementById("table-header-row");
            const tableBody = document.getElementById("table-body-elements");

            headerRow.innerHTML = "";
            tableBody.innerHTML = "";

            // --- 1. HEADER ROW RENDERING ---
            const thEnemyBase = document.createElement("th");
            thEnemyBase.innerText = "Deck";
            headerRow.appendChild(thEnemyBase);

            const thMetaFlag = document.createElement("th");
            thMetaFlag.innerText = "META";
            headerRow.appendChild(thMetaFlag);

            // Populate header cards items columns elements
            state.cards.forEach(cardName => {
                const thCard = document.createElement("th");
                
                const headerContainer = document.createElement("div");
                headerContainer.className = "cell-header-content";

                const labelSpan = document.createElement("span");
                labelSpan.innerText = cardName;
                labelSpan.style.cursor = "pointer";
                labelSpan.title = "Doble clic para editar";
                labelSpan.addEventListener("dblclick", () => triggerNodeRenameSequence("CARD", cardName));

                const delBtn = document.createElement("button");
                delBtn.className = "btn-delete-node";
                delBtn.innerHTML = '<span style="display:inline-block; width:14px; height:14px; font-size:18px; line-height:12px;">×</span>';
                delBtn.addEventListener("click", () => {
                    invokeConfirmation(`¿Está seguro de que desea eliminar la carta "${cardName}"?`, () => {
                        state.cards = state.cards.filter(c => c !== cardName);
                        Object.keys(state.ratings).forEach(key => {
                            if (key.endsWith(`::${cardName}`)) delete state.ratings[key];
                        });
                        state.isSynced = false;
                        saveToLocalStorage();
                        buildEvaluationMatrixStructure();
                    });
                });

                headerContainer.appendChild(labelSpan);
                headerContainer.appendChild(delBtn);
                thCard.appendChild(headerContainer);
                headerRow.appendChild(thCard);
            });

            // --- 2. ADVERSARIES ROWS RENDERING ---
            state.enemyDecks.forEach((enemyObj) => {
                const trEnemy = document.createElement("tr");

                const tdName = document.createElement("td");
                const nameContainer = document.createElement("div");
                nameContainer.className = "cell-header-content";

                const nameLabel = document.createElement("span");
                nameLabel.innerText = enemyObj.name;
                nameLabel.style.cursor = "pointer";
                nameLabel.title = "Doble clic para editar";
                nameLabel.addEventListener("dblclick", () => triggerNodeRenameSequence("ENEMY", enemyObj.name));

                const delEnemyBtn = document.createElement("button");
                delEnemyBtn.className = "btn-delete-node";
                delEnemyBtn.innerHTML = '<span style="display:inline-block; width:14px; height:14px; font-size:18px; line-height:12px;">×</span>'; 
                delEnemyBtn.addEventListener("click", () => {
                    invokeConfirmation(`¿Está seguro de que desea eliminar el deck adversario "${enemyObj.name}"?`, () => {
                        state.enemyDecks = state.enemyDecks.filter(e => e.name !== enemyObj.name);
                        Object.keys(state.ratings).forEach(key => {
                            if (key.startsWith(`${enemyObj.name}::`)) delete state.ratings[key];
                        });
                        state.isSynced = false;
                        saveToLocalStorage();
                        buildEvaluationMatrixStructure();
                    });
                });

                nameContainer.appendChild(nameLabel);
                nameContainer.appendChild(delEnemyBtn);
                tdName.appendChild(nameContainer);
                trEnemy.appendChild(tdName);

                const tdMeta = document.createElement("td");
                const chkMeta = document.createElement("input");
                chkMeta.type = "checkbox";
                chkMeta.className = "meta-checkbox";
                chkMeta.checked = enemyObj.isMeta;
                chkMeta.addEventListener("change", (e) => {
                    enemyObj.isMeta = e.target.checked;
                    state.isSynced = false;
                    saveToLocalStorage();
                    recalculateLiveValuationRowUI();
                });
                tdMeta.appendChild(chkMeta);
                trEnemy.appendChild(tdMeta);

                state.cards.forEach(cardName => {
                    const tdRating = document.createElement("td");
                    tdRating.className = "rating-interactive-cell";
                    
                    const currentRatingKey = `${enemyObj.name}::${cardName}`;
                    const currentRatingVal = state.ratings[currentRatingKey] || "INEFICIENTE";

                    const triggerBtn = document.createElement("button");
                    triggerBtn.className = "rating-trigger-btn";
                    triggerBtn.setAttribute("data-rating", currentRatingVal);
                    triggerBtn.innerText = currentRatingVal;

                    triggerBtn.addEventListener("click", () => {
                        const statesSequence = ["INEFICIENTE", "BUENA", "COUNTER", "MALA"];
                        const nextIndex = (statesSequence.indexOf(state.ratings[currentRatingKey] || "INEFICIENTE") + 1) % statesSequence.length;
                        const targetValue = statesSequence[nextIndex];
                        
                        state.ratings[currentRatingKey] = targetValue;
                        triggerBtn.setAttribute("data-rating", targetValue);
                        triggerBtn.innerText = targetValue;
                        
                        state.isSynced = false;
                        saveToLocalStorage();
                        recalculateLiveValuationRowUI();
                    });

                    tdRating.appendChild(triggerBtn);
                    trEnemy.appendChild(tdRating);
                });

                tableBody.appendChild(trEnemy);
            });

            // --- 3. DYNAMIC VALUATION ROW FOOTER ATTACHMENT ---
            const trValuation = document.createElement("tr");
            trValuation.className = "valuation-row";

            const tdValLabel = document.createElement("td");
            tdValLabel.innerText = "VALORACIÓN";
            tdValLabel.style.fontWeight = "700";
            trValuation.appendChild(tdValLabel);

            const tdValSpacer = document.createElement("td");
            trValuation.appendChild(tdValSpacer);

            state.cards.forEach(cardName => {
                const tdScore = document.createElement("td");
                tdScore.className = "valuation-score";
                tdScore.id = `score-cell-${btoa(encodeURIComponent(cardName)).replace(/=/g, "")}`;
                tdScore.innerText = computeCardSumaTotal(cardName);
                trValuation.appendChild(tdScore);
            });

            tableBody.appendChild(trValuation);
            
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function recalculateLiveValuationRowUI() {
            state.cards.forEach(cardName => {
                const safeId = `score-cell-${btoa(encodeURIComponent(cardName)).replace(/=/g, "")}`;
                const targetCell = document.getElementById(safeId);
                if (targetCell) {
                    targetCell.innerText = computeCardSumaTotal(cardName);
                }
            });
        }

        function triggerNodeRenameSequence(nodeType, currentKeyName) {
            const contextLabel = nodeType === "CARD" ? "la carta" : "el adversario";
            const promptInput = prompt(`Editar nombre para ${contextLabel}:`, currentKeyName);
            
            if (promptInput === null) return; 
            
            const sanitizedName = promptInput.trim();
            if (!sanitizedName) {
                alert("El nombre no puede estar vacío.");
                return;
            }

            if (sanitizedName === currentKeyName) return;

            if (nodeType === "CARD") {
                if (state.cards.some(c => c.toLowerCase() === sanitizedName.toLowerCase())) {
                    alert("Ya existe una carta con ese nombre.");
                    return;
                }
                state.cards = state.cards.map(c => c === currentKeyName ? sanitizedName : c);
                state.enemyDecks.forEach(e => {
                    const trackingOldKey = `${e.name}::${currentKeyName}`;
                    const trackingNewKey = `${e.name}::${sanitizedName}`;
                    if (state.ratings[trackingOldKey] !== undefined) {
                        state.ratings[trackingNewKey] = state.ratings[trackingOldKey];
                        delete state.ratings[trackingOldKey];
                    }
                });
            } else {
                if (state.enemyDecks.some(e => e.name.toLowerCase() === sanitizedName.toLowerCase())) {
                    alert("Ya existe un deck adversario con ese nombre.");
                    return;
                }
                state.enemyDecks = state.enemyDecks.map(e => e.name === currentKeyName ? { ...e, name: sanitizedName } : e);
                state.cards.forEach(c => {
                    const trackingOldKey = `${currentKeyName}::${c}`;
                    const trackingNewKey = `${sanitizedName}::${c}`;
                    if (state.ratings[trackingOldKey] !== undefined) {
                        state.ratings[trackingNewKey] = state.ratings[trackingOldKey];
                        delete state.ratings[trackingOldKey];
                    }
                });
            }

            state.isSynced = false;
            saveToLocalStorage();
            buildEvaluationMatrixStructure();
        }

        function sortColumnsByCalculatedPerformance() {
            if (state.cards.length <= 1) return;

            const mappedTuples = state.cards.map(card => {
                return { name: card, computedScore: computeCardSumaTotal(card) };
            });

            mappedTuples.sort((nodeA, nodeB) => nodeB.computedScore - nodeA.computedScore);
            
            state.cards = mappedTuples.map(item => item.name);
            state.isSynced = false;
            saveToLocalStorage();
            buildEvaluationMatrixStructure();
        }

        function openConfigurationProfileModal() {
            document.getElementById("cfg-n-mala").value = state.weightsNormal.MALA;
            document.getElementById("cfg-n-ineficiente").value = state.weightsNormal.INEFICIENTE;
            document.getElementById("cfg-n-buena").value = state.weightsNormal.BUENA;
            document.getElementById("cfg-n-counter").value = state.weightsNormal.COUNTER;

            document.getElementById("cfg-m-mala").value = state.weightsMeta.MALA;
            document.getElementById("cfg-m-ineficiente").value = state.weightsMeta.INEFICIENTE;
            document.getElementById("cfg-m-buena").value = state.weightsMeta.BUENA;
            document.getElementById("cfg-m-counter").value = state.weightsMeta.COUNTER;

            openModal('modal-config');
        }

        function commitProfileConfigurationsChange() {
            state.weightsNormal.MALA = Number(document.getElementById("cfg-n-mala").value);
            state.weightsNormal.INEFICIENTE = Number(document.getElementById("cfg-n-ineficiente").value);
            state.weightsNormal.BUENA = Number(document.getElementById("cfg-n-buena").value);
            state.weightsNormal.COUNTER = Number(document.getElementById("cfg-n-counter").value);

            state.weightsMeta.MALA = Number(document.getElementById("cfg-m-mala").value);
            state.weightsMeta.INEFICIENTE = Number(document.getElementById("cfg-m-ineficiente").value);
            state.weightsMeta.BUENA = Number(document.getElementById("cfg-m-buena").value);
            state.weightsMeta.COUNTER = Number(document.getElementById("cfg-m-counter").value);

            state.isSynced = false;
            saveToLocalStorage();
            closeModal('modal-config');
            buildEvaluationMatrixStructure();
        }

        async function commitStateUploadToCloud() {
            const targetDeckName = state.deckName.trim();
            if (!targetDeckName) {
                alert("Por favor asigne un nombre válido al análisis antes de guardar.");
                return;
            }

            try {
                const collectionRef = collection(db, "Decks");
                const matchingQuery = query(collectionRef, where("deckName", "==", targetDeckName));
                const querySnapshot = await getDocs(matchingQuery);

                let targetDocumentID = state.id;
                let executionPromptMessage = "";
                let isOverwriteAction = false;

                if (!querySnapshot.empty) {
                    const foundDoc = querySnapshot.docs[0];
                    targetDocumentID = foundDoc.id;
                    isOverwriteAction = true;
                    executionPromptMessage = "Este análisis ya existe.\n¿Desea sobrescribirlo?";
                } else {
                    if (!targetDocumentID) {
                        targetDocumentID = "doc_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
                    }
                    executionPromptMessage = "Se creará un nuevo análisis en la nube.\n¿Desea continuar?";
                }

                invokeConfirmation(executionPromptMessage, async () => {
                    const currentTimestampISO = new Date().toISOString();
                    
                    let documentPayload = {
                        id: targetDocumentID,
                        deckName: targetDeckName,
                        cards: state.cards,
                        enemyDecks: state.enemyDecks,
                        ratings: state.ratings,
                        weightsNormal: state.weightsNormal,
                        weightsMeta: state.weightsMeta,
                        updatedAt: currentTimestampISO
                    };

                    if (isOverwriteAction) {
                        const existingData = querySnapshot.docs[0].data();
                        documentPayload.createdAt = existingData.createdAt || currentTimestampISO;
                    } else {
                        documentPayload.createdAt = currentTimestampISO;
                    }

                    await setDoc(doc(db, "Decks", targetDocumentID), documentPayload);

                    state.id = targetDocumentID;
                    state.createdAt = documentPayload.createdAt;
                    state.updatedAt = documentPayload.updatedAt;
                    state.isSynced = true;

                    saveToLocalStorage();
                    alert("Guardado correctamente.");
                });

            } catch (err) {
                console.error("Error committing dataset changes onto Firestore backend engines.", err);
                alert("Ocurrió un error al intentar conectarse con el servidor remoto.");
            }
        }

        async function fetchAndPopulateCloudDecksList() {
            const container = document.getElementById("cloud-decks-container");
            container.innerHTML = '<div style="color: var(--text-muted); font-size:0.9rem;">Cargando listado remoto...</div>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "Decks"));
                remoteDecksCache = [];
                
                querySnapshot.forEach((docSnap) => {
                    if (docSnap.exists()) {
                        remoteDecksCache.push(docSnap.data());
                    }
                });

                remoteDecksCache.sort((a, b) => {
                    const timeA = new Date(a.updatedAt || 0);
                    const timeB = new Date(b.updatedAt || 0);
                    return timeB - timeA;
                });

                renderFilteredCloudDecks(remoteDecksCache);
                openModal('modal-open');

            } catch (err) {
                console.error("Error reading collection snapshots from remote context database endpoints.", err);
                container.innerHTML = '<div style="color: var(--color-mala); font-size:0.9rem;">Error al leer datos remotos de Firebase.</div>';
            }
        }

        function renderFilteredCloudDecks(dataset) {
            const container = document.getElementById("cloud-decks-container");
            container.innerHTML = "";

            if (dataset.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted); font-size:0.9rem;">No se encontraron registros.</div>';
                return;
            }

            dataset.forEach(deckDoc => {
                const itemNode = document.createElement("div");
                itemNode.className = "deck-item";
                
                const infoWrapper = document.createElement("div");
                infoWrapper.className = "deck-item-info";
                
                const nameDiv = document.createElement("div");
                nameDiv.className = "name";
                nameDiv.innerText = deckDoc.deckName;

                const formattedDate = deckDoc.updatedAt ? new Date(deckDoc.updatedAt).toLocaleString() : "Sin fecha";
                const dateDiv = document.createElement("div");
                dateDiv.className = "date";
                dateDiv.innerText = `Última modificación: ${formattedDate}`;

                infoWrapper.appendChild(nameDiv);
                infoWrapper.appendChild(dateDiv);
                itemNode.appendChild(infoWrapper);

                const openIcon = document.createElement("i");
                openIcon.className = "lucide-chevron-right";
                openIcon.style.color = "var(--text-muted)";
                itemNode.appendChild(openIcon);

                itemNode.addEventListener("click", () => {
                        state.id = deckDoc.id;
                        state.deckName = deckDoc.deckName;
                        state.cards = deckDoc.cards || [];
                        state.enemyDecks = deckDoc.enemyDecks || [];
                        state.ratings = deckDoc.ratings || {};
                        state.weightsNormal = deckDoc.weightsNormal || { MALA: -1, INEFICIENTE: 0, BUENA: 1, COUNTER: 3 };
                        state.weightsMeta = deckDoc.weightsMeta || { MALA: -2, INEFICIENTE: -1, BUENA: 2, COUNTER: 4 };
                        state.createdAt = deckDoc.createdAt;
                        state.updatedAt = deckDoc.updatedAt;
                        state.isSynced = true;

                        saveToLocalStorage();
                        renderInterfaceAll();
                        closeModal('modal-open');
                    });
              

                container.appendChild(itemNode);
            });
            
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        document.getElementById("input-deck-name").addEventListener("input", (e) => {
            state.deckName = e.target.value;
            state.isSynced = false;
            saveToLocalStorage();
        });

        function executeAdversaryAdditionPipeline() {
            const inputField = document.getElementById("input-enemy-name");
            const targetValue = inputField.value.trim();
            
            if (!targetValue) return;

            const exists = state.enemyDecks.some(e => e.name.toLowerCase() === targetValue.toLowerCase());
            if (exists) {
                alert("Este deck adversario ya existe en la matriz.");
                return;
            }

            state.enemyDecks.push({ name: targetValue, isMeta: false });
            state.isSynced = false;
            inputField.value = "";
            saveToLocalStorage();
            buildEvaluationMatrixStructure();
        }

        document.getElementById("input-enemy-name").addEventListener("keydown", (e) => { if (e.key === "Enter") executeAdversaryAdditionPipeline(); });

        function executeCardAdditionPipeline() {
            const inputField = document.getElementById("input-card-name");
            const targetValue = inputField.value.trim();

            if (!targetValue) return;

            const exists = state.cards.some(c => c.toLowerCase() === targetValue.toLowerCase());
            if (exists) {
                alert("Esta carta ya existe en la matriz.");
                return;
            }

            state.cards.push(targetValue);
            state.isSynced = false;
            inputField.value = "";
            saveToLocalStorage();
            buildEvaluationMatrixStructure();
        }

        document.getElementById("input-card-name").addEventListener("keydown", (e) => { if (e.key === "Enter") executeCardAdditionPipeline(); });

        document.getElementById("btn-sort-cards").addEventListener("click", sortColumnsByCalculatedPerformance);
        document.getElementById("btn-config").addEventListener("click", openConfigurationProfileModal);
        document.getElementById("btn-save-config").addEventListener("click", commitProfileConfigurationsChange);
        document.getElementById("btn-save-cloud").addEventListener("click", commitStateUploadToCloud);
        document.getElementById("btn-open-deck").addEventListener("click", fetchAndPopulateCloudDecksList);

        document.getElementById("search-deck-input").addEventListener("input", (e) => {
            const queryText = e.target.value.toLowerCase().trim();
            const filteredData = remoteDecksCache.filter(item => item.deckName.toLowerCase().includes(queryText));
            renderFilteredCloudDecks(filteredData);
        });

        document.getElementById("btn-new-deck").addEventListener("click", () => {
            invokeConfirmation("¿Desea crear un nuevo análisis?\nSe vaciará la memoria de trabajo local.", () => {
                state.id = null;
                state.deckName = "Mi Nuevo Analysis Deck";
                state.cards = [];
                state.enemyDecks = [];
                state.ratings = {};
                state.createdAt = null;
                state.updatedAt = null;
                state.isSynced = false;

                localStorage.removeItem("CMDA_DECK_DATA");
                renderInterfaceAll();
            });
        });

        document.addEventListener("DOMContentLoaded", () => {
            loadFromLocalStorage();
        });
        
        loadFromLocalStorage();

    </script>

    <!-- Global Modal Windows Interface Helper Framework Handlers -->
    <script>
        function openModal(modalId) {
            const targetModal = document.getElementById(modalId);
            targetModal.style.display = "flex";
            setTimeout(() => {
                targetModal.classList.add("active");
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, 10);
        }
        function closeModal(modalId) {
            const targetModal = document.getElementById(modalId);
            targetModal.classList.remove("active");
            setTimeout(() => {
                targetModal.style.display = "none";
            }, 200); 
            
            if (modalId === 'modal-open') {
                document.getElementById("search-deck-input").value = "";
            }
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>
